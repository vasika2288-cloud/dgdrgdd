<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#150f26" />
  <title>Meow Squad — Коты-маги против крысиной орды</title>
  <meta name="description" content="Meow Squad: коты-маги кружат вокруг героя и сами атакуют крысиную орду. Динамичный браузерный survivors-рогалик." />
  <meta property="og:site_name" content="Meow Squad" />
  <meta property="og:title" content="Meow Squad — Коты-маги против крысиной орды" />
  <meta property="og:description" content="Управляй героем, собирай отряд боевых котов-магов и уничтожай крысиную орду в динамичном survivors-рогалике." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/lobby.css" />
</head>
<body>

  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="xpbar"><div id="xpfill"></div><span id="lvl">Ур. 1</span></div>
    <div class="toprow">
      <div class="hpbox">
        <div class="hp"><div id="hpfill"></div><span id="hptext">100 / 100</span></div>
        <div class="cats" id="catcount">🐱 × 2</div>
      </div>
      <div class="timerbox">
        <div id="timer">00:00</div>
        <div class="runbar"><div id="runfill"></div><span class="bossmark" title="Босс">👑</span></div>
      </div>
      <div class="rightbox">
        <div id="kills">☠ 0</div>
        <button id="pauseBtn" aria-label="Пауза">❚❚</button>
      </div>
    </div>
    <div id="bossbar" class="hidden">
      <div class="bname">Крысиный Король Мракус</div>
      <div class="bbar"><div id="bossfill"></div></div>
    </div>
  </div>

  <div id="banner"></div>

  <!-- Lobby (lobby.js renders the dynamic parts) -->
  <div id="menu" class="screen lobby">
    <header class="lb-top">
      <button class="lb-profile" id="lbProfile" aria-label="Профиль и настройки">
        <span class="lb-ava" id="lbAva"></span>
        <span class="lb-pinfo">
          <span class="lb-pname" id="lbName">Маг</span>
          <span class="lb-plvl"><b id="lbLvl">1</b><span class="lb-xpbar"><i id="lbXp"></i></span></span>
        </span>
      </button>
      <div class="lb-res">
        <button class="lb-pill energy" id="lbEnergyPill" aria-label="Энергия"><span class="ic"><svg><use href="#i-bolt"/></svg></span><span id="lbEnergy">30/30</span><small id="lbEnergyT"></small><span class="plus"><svg><use href="#i-plus"/></svg></span></button>
        <button class="lb-pill coins" data-goto="shop" aria-label="Рыбки"><span class="ic"><svg><use href="#i-fish"/></svg></span><span id="lbCoins">0</span><span class="plus"><svg><use href="#i-plus"/></svg></span></button>
        <button class="lb-pill gems" data-goto="shop" aria-label="Кристаллы"><span class="ic"><svg><use href="#i-gem"/></svg></span><span id="lbGems">0</span><span class="plus"><svg><use href="#i-plus"/></svg></span></button>
      </div>
    </header>

    <main class="lb-main">
      <!-- Battle -->
      <section class="lb-view battle" data-view="battle">
        <div class="lb-chapter" id="lbChapter">
          <div class="lb-chcard" id="lbChCard">
            <div class="lb-chinfo">
              <div class="lb-chnum" id="lbChNum">Глава 1</div>
              <div class="lb-chname" id="lbChName">1. Мятная долина</div>
              <div class="lb-chmeta" id="lbChMeta"></div>
            </div>
            <div class="lb-chstage">
              <div class="lb-chart" id="lbChArt"></div>
              <button class="lb-arrow prev" id="lbPrev" aria-label="Предыдущая глава"><svg><use href="#i-chev"/></svg></button>
              <button class="lb-arrow next" id="lbNext" aria-label="Следующая глава"><svg><use href="#i-chev"/></svg></button>
            </div>
          </div>
          <div class="lb-chdots" id="lbChDots"></div>
        </div>

        <div class="lb-stage">
          <div class="lb-side left">
            <button class="lb-round" id="lbDailyBtn"><span><svg><use href="#i-gift"/></svg></span><em>Награда</em><i class="dot hidden" id="lbDailyDot"></i></button>
            <button class="lb-round" id="lbQuestBtn"><span><svg><use href="#i-scroll"/></svg></span><em>Задания</em><i class="dot hidden" id="lbQuestDot"></i></button>
          </div>
          <div class="lb-side right">
            <button class="lb-round" id="lbStatsBtn"><span><svg><use href="#i-trophy"/></svg></span><em>Рекорды</em></button>
            <button class="lb-round" id="lbSoundBtn"><span><svg><use id="lbSoundIc" href="#i-sound"/></svg></span><em>Звук</em></button>
          </div>
        </div>

        <div class="lb-bottom">
          <div class="lb-miles" id="lbMiles"></div>
          <button class="lb-leader" data-goto="squad" id="lbLeader"></button>
          <button class="lb-play" id="lbPlay"><span class="t">В бой</span><span class="c"><svg><use href="#i-bolt"/></svg><b id="lbCost">5</b></span></button>
          <div id="best" class="best"></div>
        </div>
      </section>

      <!-- Shop -->
      <section class="lb-view panelview hidden" data-view="shop">
        <h3 class="lb-h"><span>Лавка</span></h3>
        <div class="lb-scroll" id="lbShop"></div>
      </section>

      <!-- Squad -->
      <section class="lb-view panelview hidden" data-view="squad">
        <h3 class="lb-h"><span>Отряд</span> <small id="lbPower"></small></h3>
        <div class="lb-scroll"><div class="lb-cats" id="lbCats"></div></div>
      </section>

      <!-- Evolution -->
      <section class="lb-view panelview hidden" data-view="evolve">
        <h3 class="lb-h"><span>Эволюция</span></h3>
        <div class="lb-scroll" id="lbTalents"></div>
      </section>

      <!-- Challenges -->
      <section class="lb-view panelview hidden" data-view="challenge">
        <h3 class="lb-h"><span>Испытания</span></h3>
        <div class="lb-scroll" id="lbChallenges"></div>
      </section>
    </main>

    <nav class="lb-nav">
      <button data-tab="shop"><span><svg><use href="#i-bag"/></svg></span><em>Лавка</em></button>
      <button data-tab="squad"><span><svg><use href="#i-paw"/></svg></span><em>Отряд</em></button>
      <button data-tab="battle" class="active"><span><svg><use href="#i-swords"/></svg></span><em>Бой</em></button>
      <button data-tab="evolve"><span><svg><use href="#i-evolve"/></svg></span><em>Эволюция</em></button>
      <button data-tab="challenge"><span><svg><use href="#i-flame"/></svg></span><em>Испытания</em></button>
    </nav>
  </div>

  <!-- Lobby modal + toast -->
  <div id="lbModal" class="lb-modal hidden" role="dialog" aria-modal="true">
    <div class="lb-mpanel">
      <button class="lb-mclose" id="lbMClose" aria-label="Закрыть">✕</button>
      <div id="lbMBody"></div>
    </div>
  </div>
  <div id="lbToast" class="lb-toast"></div>

  <!-- Level up -->
  <div id="levelup" class="screen hidden">
    <div class="lu-wrap">
      <div class="lu-confetti" id="luConfetti"></div>
      <div class="lu-ribbon"><h2>Выбор навыка</h2></div>
      <div class="lu-slots">
        <div class="lu-row cats" id="luCats"></div>
        <div class="lu-row items" id="luItems"></div>
      </div>
      <div id="cards"></div>
      <p class="lu-hint">Выбери навык для изучения</p>
    </div>
  </div>

  <!-- Pause -->
  <div id="pause" class="screen hidden">
    <div class="panel">
      <h2>Пауза</h2>
      <div id="buildList" class="buildlist"></div>
      <button id="resumeBtn" class="btn primary">Продолжить</button>
      <button id="quitBtn" class="btn ghost">Выйти в лобби</button>
    </div>
  </div>

  <!-- Game over / victory -->
  <div id="over" class="screen hidden">
    <div class="panel">
      <h2 id="overTitle">Забег окончен</h2>
      <p id="overSub" class="sub"></p>
      <div id="overStats" class="stats"></div>
      <div id="overRewards" class="rewards"></div>
      <button id="againBtn" class="btn primary">Ещё забег</button>
      <button id="menuBtn" class="btn ghost">В лобби</button>
    </div>
  </div>

  <script src="/lobby.js"></script>
  <script src="/game.js"></script>
</body>
</html>
